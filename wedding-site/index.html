<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Wedding Invitation</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for that elegant wedding look -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<audio id="weddingMusic" loop>
    <source src="wedding-song.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>

<!-- Floating Music Button -->
<button id="musicControl" class="music-btn">
    <span id="musicIcon">🎵</span>
</button>
    <!-- Hero Section -->
    <header class="hero">
        <div class="hero-content">
            <h2 class="script-font">Save the Date</h2>
            <h1>Julius & Demi</h1>
            <p class="date">August 28, 2026</p>
        </div>
    </header>

    <!-- RSVP Section -->
    <section id="rsvp" class="section">
        <h2>Will You Attend?</h2>
        <form id="rsvpForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <select id="attendance">
                <option value="yes">Joyfully Accept</option>
                <option value="no">Regretfully Decline</option>
            </select>
            <textarea id="dietary" placeholder="Dietary Restrictions (Optional)"></textarea>
            <button type="submit">Submit RSVP</button>
        </form>
        <p id="responseMsg"></p>
    </section>

    <script src="script.js"></script>
</body>
</html>
